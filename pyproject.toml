[project]
name = "azure-mcp-appservice"
version = "0.1.0"
description = "Entra ID, private MCP, and Foundry on Azure App Service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.12,<4",
  "azure-identity>=1.25,<2",
  "fastapi>=0.121,<1",
  "httpx>=0.28,<1",
  "httpx2>=2.10,<3",
  "mcp==2.3.0",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
