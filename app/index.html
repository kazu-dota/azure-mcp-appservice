<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品・在庫アシスタント</title>
<style>
  :root { color-scheme: light; font: 16px/1.7 system-ui, sans-serif; color: #143338; }
  body { margin: 0; background: #f0f6f5; }
  main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  h1 { font-size: 1.8rem; margin-bottom: 0; }
  .tag { color: #386766; font-size: .85rem; }
  #messages { display: grid; gap: 16px; margin: 32px 0; }
  article { background: white; border: 1px solid #d4e3e0; border-radius: 12px; padding: 20px; }
  article p { white-space: pre-wrap; margin: 8px 0; }
  .user { background: #e1efeb; }
  .tools { color: #386766; font-size: .85rem; }
  textarea { box-sizing: border-box; width: 100%; min-height: 100px; padding: 14px;
    border: 1px solid #9bb8b2; border-radius: 8px; font: inherit; resize: vertical; }
  button { background: #176b5b; color: white; padding: 10px 24px; border: 0;
    border-radius: 8px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { min-height: 28px; color: #715d24; }
  a { color: #176b5b; }
</style>
<main>
  <header><div><span class="tag">Entra ID · Private MCP · Foundry</span>
    <h1>商品・在庫アシスタント</h1></div><a href="/.auth/logout">ログアウト</a></header>
  <p>架空の商品情報をMCPツールで確認して回答するデモです。質問ごとに照会します。</p>
  <p class="tag">例：「ノートPCを探しています」「商品ID PC001 の在庫は？」</p>
  <div id="messages" role="log" aria-live="polite"></div>
  <form id="chat"><label for="question">質問</label>
    <textarea id="question" maxlength="2000" required placeholder="知りたい商品や在庫を入力"></textarea>
    <p><button id="send" type="submit">質問する</button></p>
  </form>
  <p id="status" role="status"></p>
  <small>デモ用データです。回答の下に実際に呼び出したツール名を表示します。</small>
</main>
<script>
  const form = document.querySelector('#chat'), input = document.querySelector('#question');
  const send = document.querySelector('#send'), status = document.querySelector('#status');
  function message(label, text, tools = []) {
    const article = document.createElement('article');
    if (label === 'あなた') article.className = 'user';
    const heading = document.createElement('strong'); heading.textContent = label;
    const body = document.createElement('p'); body.textContent = text;
    article.append(heading, body);
    if (tools.length) {
      const detail = document.createElement('div'); detail.className = 'tools';
      detail.textContent = '使用したMCPツール：' + tools.join(' → '); article.append(detail);
    }
    document.querySelector('#messages').append(article);
    article.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
  form.addEventListener('submit', async event => {
    event.preventDefault(); const question = input.value.trim(); if (!question) return;
    send.disabled = true; message('あなた', question); input.value = '';
    status.textContent = '商品情報を確認しています…';
    try {
      const response = await fetch('/api/chat', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question})});
      if (response.redirected) { location.assign('/.auth/login/aad'); return; }
      const data = await response.json();
      if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '入力を確認してください');
      message('アシスタント', data.answer, data.tools); status.textContent = '';
    } catch (error) { status.textContent = 'エラー：' + error.message; }
    finally { send.disabled = false; input.focus(); }
  });
</script>
</html>
