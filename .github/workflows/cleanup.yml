name: Cleanup
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      confirm_prefix:
        description: 'Exact environment prefix (azmcp + six characters) to delete'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  actions: write
concurrency:
  group: azure-environment
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AZURE_CONFIG: ${{ vars.AZURE_CONFIG }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      CLEANUP_NOW: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      CONFIRM_PREFIX: ${{ inputs.confirm_prefix }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check expiration or manual target
        id: config
        run: python scripts/manage.py prepare --cleanup
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.config.outputs.due == 'true'
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        if: steps.config.outputs.due == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Destroy the verified demo environment
        if: steps.config.outputs.due == 'true'
        run: python scripts/manage.py cleanup
